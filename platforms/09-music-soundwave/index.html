<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundWave | Cloud Music Streaming & Audio Studio</title>
  <meta name="description" content="SoundWave - Dasturchilar uchun fokus musiqalari, jonli audio vizualizator va ekvalayzerga ega zamonaviy audio platforma.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="wave-header">
    <div class="nav-left">
      <a href="../../index.html" class="hub-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Hub</span>
      </a>
      <div class="brand">
        <div class="wave-icon">🎵</div>
        <span class="brand-title">Sound<span>Wave</span></span>
      </div>
    </div>
    <div class="nav-center">
      <input type="text" id="trackSearch" placeholder="Trek yoki ijrochini qidirish...">
    </div>
    <div class="nav-right">
      <span class="audio-engine-badge">⚡ Web Audio DSP Engine Active</span>
    </div>
  </header>

  <!-- Main App Layout -->
  <div class="music-layout">
    <!-- Left Sidebar: Playlists & Library -->
    <aside class="music-sidebar">
      <div class="sidebar-block">
        <h4>Kutubxona</h4>
        <nav class="side-nav">
          <button class="nav-item active">🔥 Tavsiya etilganlar</button>
          <button class="nav-item">💻 Fokus & Kodlash</button>
          <button class="nav-item">🌙 Kechki Chillhop</button>
          <button class="nav-item">❤️ Sevimlilar</button>
        </nav>
      </div>

      <div class="sidebar-block equalizer-sidebar">
        <h4>Jonli Spektr Vizualizatori</h4>
        <canvas id="visualizerCanvas" width="240" height="90"></canvas>
      </div>
    </aside>

    <!-- Center: Track Explorer -->
    <main class="music-content">
      <!-- Now Playing Hero Card -->
      <div class="hero-player-card">
        <div class="now-playing-visual">
          <div class="vinyl-disc" id="vinylDisc">
            <div class="vinyl-center">🎧</div>
          </div>
        </div>
        <div class="now-playing-info">
          <span class="now-badge">HOZIR YANGRAMOQDA</span>
          <h1 id="currentTrackTitle">Cyber Cyberpunk Drift</h1>
          <p id="currentTrackArtist">Antigravity Sound Lab • Synthwave 2026</p>
          <div class="track-tags">
            <span>#DeepFocus</span>
            <span>#LoFiCoding</span>
            <span>#128BPM</span>
          </div>
        </div>
      </div>

      <!-- Tracks Table -->
      <div class="tracks-section">
        <h3>Tavsiya Etilgan Treklar</h3>
        <div class="track-list" id="trackList">
          <!-- Injected by JS -->
        </div>
      </div>
    </main>
  </div>

  <!-- Bottom Player Bar -->
  <footer class="bottom-player-bar">
    <div class="player-left">
      <div class="mini-cover" id="miniCover">🎧</div>
      <div>
        <h4 id="barTrackTitle">Cyber Cyberpunk Drift</h4>
        <span id="barArtist">Antigravity Sound Lab</span>
      </div>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="ctrl-icon" id="prevTrackBtn" title="Oldingi">⏮</button>
        <button class="ctrl-play-btn" id="playToggleBtn" title="Ijro / Pauza">▶</button>
        <button class="ctrl-icon" id="nextTrackBtn" title="Keyingi">⏭</button>
      </div>
      <div class="scrubber-bar">
        <span id="currentTime">0:00</span>
        <input type="range" id="trackScrubber" min="0" max="180" value="0">
        <span id="totalDuration">3:24</span>
      </div>
    </div>

    <div class="player-right">
      <span class="vol-icon">🔊</span>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.7">
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
