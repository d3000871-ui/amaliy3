<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow Pro | Agile Kanban & Project Management SaaS</title>
  <meta name="description" content="TaskFlow Pro - Dasturiy ta'minot jamoalari uchun qulay, interaktiv va zamonaviy Kanban loyiha boshqaruv tizimi.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Top App Bar -->
  <header class="app-bar">
    <div class="bar-left">
      <a href="../../index.html" class="hub-pill">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        <span>Hub</span>
      </a>
      <div class="logo">
        <div class="logo-mark">⚡</div>
        <span class="logo-name">Task<span>Flow</span></span>
        <span class="pro-tag">PRO</span>
      </div>
    </div>

    <div class="bar-center">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="taskSearch" placeholder="Vazifalar ichidan qidirish...">
      </div>
    </div>

    <div class="bar-right">
      <button class="add-task-btn" id="openNewTaskModal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Yangi Vazifa</span>
      </button>
    </div>
  </header>

  <!-- Metrics Header -->
  <section class="metrics-section">
    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-icon">📋</div>
        <div>
          <span class="metric-label">Jami Vazifalar</span>
          <h3 id="statTotal">0</h3>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">⏳</div>
        <div>
          <span class="metric-label">Jarayonda (In Progress)</span>
          <h3 id="statInProgress" style="color:#38bdf8;">0</h3>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">🔍</div>
        <div>
          <span class="metric-label">Ko'rib chiqilmoqda (Review)</span>
          <h3 id="statReview" style="color:#f59e0b;">0</h3>
        </div>
      </div>
      <div class="metric-card">
        <div class="metric-icon">✅</div>
        <div>
          <span class="metric-label">Tugallangan (Done)</span>
          <h3 id="statDone" style="color:#10b981;">0</h3>
        </div>
      </div>
    </div>
  </section>

  <!-- Kanban Board Container -->
  <main class="board-container">
    <div class="kanban-board">
      <!-- Column 1: Backlog -->
      <div class="kanban-col" data-status="backlog">
        <div class="col-header">
          <div class="col-title">
            <span class="status-indicator backlog"></span>
            <h4>Kutilayotgan (Backlog)</h4>
          </div>
          <span class="count-badge" id="count-backlog">0</span>
        </div>
        <div class="col-cards-wrapper" id="cards-backlog"></div>
      </div>

      <!-- Column 2: In Progress -->
      <div class="kanban-col" data-status="inprogress">
        <div class="col-header">
          <div class="col-title">
            <span class="status-indicator inprogress"></span>
            <h4>Jarayonda (In Progress)</h4>
          </div>
          <span class="count-badge" id="count-inprogress">0</span>
        </div>
        <div class="col-cards-wrapper" id="cards-inprogress"></div>
      </div>

      <!-- Column 3: Review -->
      <div class="kanban-col" data-status="review">
        <div class="col-header">
          <div class="col-title">
            <span class="status-indicator review"></span>
            <h4>Tekshiruvda (Review)</h4>
          </div>
          <span class="count-badge" id="count-review">0</span>
        </div>
        <div class="col-cards-wrapper" id="cards-review"></div>
      </div>

      <!-- Column 4: Done -->
      <div class="kanban-col" data-status="done">
        <div class="col-header">
          <div class="col-title">
            <span class="status-indicator done"></span>
            <h4>Yakunlangan (Done)</h4>
          </div>
          <span class="count-badge" id="count-done">0</span>
        </div>
        <div class="col-cards-wrapper" id="cards-done"></div>
      </div>
    </div>
  </main>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
      <div class="modal-head">
        <h3>Yangi Vazifa Qo'shish</h3>
        <button class="close-x" id="closeTaskModal">&times;</button>
      </div>
      <form id="newTaskForm">
        <div class="form-item">
          <label>Vazifa nomi</label>
          <input type="text" id="taskTitle" required placeholder="Masalan: OAuth2 autentifikatsiyani ulash">
        </div>
        <div class="form-item">
          <label>Batafsil tavsif</label>
          <textarea id="taskDesc" rows="3" placeholder="Texnik talablar va acceptance criteria..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-item">
            <label>Muhimlik darajasi (Priority)</label>
            <select id="taskPriority">
              <option value="high">Yuqori (High 🔥)</option>
              <option value="medium" selected>O'rtacha (Medium ⚡)</option>
              <option value="low">Oddiy (Low 🟢)</option>
            </select>
          </div>
          <div class="form-item">
            <label>Teg (Yo'nalish)</label>
            <select id="taskTag">
              <option value="Frontend">Frontend UI</option>
              <option value="Backend">Backend API</option>
              <option value="AI / ML">AI / ML</option>
              <option value="DevOps">DevOps & Cloud</option>
            </select>
          </div>
        </div>
        <div class="form-item">
          <label>Mas'ul shaxs (Assignee)</label>
          <input type="text" id="taskAssignee" placeholder="Masalan: Kamronbek">
        </div>
        <button type="submit" class="submit-task-btn">Vazifani Yaratish</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
